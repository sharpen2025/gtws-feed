<!-- ═══════════════════════════════════════════════════════════════
     GOLDEN TRAIL SERIES 위젯  (trailrunners.kr/gtws 삽입용)
     ▸ 아래 data-src 의 주소만 본인 저장소 주소로 바꾸면 됩니다.
     ▸ 전체를 통째로 복사해서 아임웹 "코드 삽입" 위젯에 붙여넣으세요.
     ═══════════════════════════════════════════════════════════════ -->

<div id="gtws-widget"
     data-src="https://raw.githubusercontent.com/USERNAME/gtws-feed/main/data/gtws.json">
  <div class="gt-boot">불러오는 중…</div>
</div>

<style>
#gtws-widget{
  --gt-bg:#0b0d10; --gt-card:#14181d; --gt-card2:#1b2026; --gt-line:#262c34;
  --gt-text:#f4f6f8; --gt-muted:#9aa5b1; --gt-dim:#6f7a86;
  --gt-gold:#f9ae00; --gt-blue:#6aa9ff;
  background:var(--gt-bg) !important; color:var(--gt-text) !important;
  display:block; width:100%; max-width:100%; margin:0 auto; overflow:hidden;
  padding:20px 16px 28px; border-radius:18px;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",
              "Malgun Gothic",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  box-sizing:border-box;
}
#gtws-widget *{box-sizing:border-box; margin:0; padding:0;}
#gtws-widget a{color:var(--gt-text) !important; text-decoration:none !important;}
#gtws-widget img{display:block; max-width:100%;}
#gtws-widget button{font:inherit; cursor:pointer; border:0; background:none;}
#gtws-widget .gt-boot{color:var(--gt-muted) !important; padding:40px 0; text-align:center;}

/* ── 헤더 ── */
#gtws-widget .gt-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 14px; margin-bottom:16px;}
#gtws-widget .gt-title{color:var(--gt-text) !important; font-size:20px; font-weight:800; letter-spacing:-.01em;}
#gtws-widget .gt-title b{color:var(--gt-gold) !important; font-weight:800;}
#gtws-widget .gt-stamp{
  color:var(--gt-muted) !important; background:var(--gt-card2); border:1px solid var(--gt-line);
  font-size:12px; padding:4px 10px; border-radius:999px; margin-left:auto; white-space:nowrap;
}

/* ── 탭 ── */
#gtws-widget .gt-tabs{display:flex; gap:6px; background:var(--gt-card); border:1px solid var(--gt-line);
  border-radius:12px; padding:5px; margin-bottom:18px;}
#gtws-widget .gt-tab{
  flex:1; color:var(--gt-muted) !important; background:transparent; border-radius:9px;
  padding:9px 12px; font-size:14px; font-weight:700; text-align:center; transition:.15s;
}
#gtws-widget .gt-tab:hover{color:var(--gt-text) !important;}
#gtws-widget .gt-tab[aria-selected="true"]{color:#101317 !important; background:var(--gt-gold);}

/* ── 섹션 제목 ── */
#gtws-widget .gt-h{display:flex; align-items:center; gap:9px; margin:22px 0 12px;}
#gtws-widget .gt-h:first-child{margin-top:4px;}
#gtws-widget .gt-h span{color:var(--gt-text) !important; font-size:15px; font-weight:800; letter-spacing:.04em;}
#gtws-widget .gt-h i{display:block; width:7px; height:7px; border-radius:50%; background:var(--gt-gold);}
#gtws-widget .gt-h em{color:var(--gt-dim) !important; font-style:normal; font-size:12px; font-weight:600;}

/* ── Next up 카드 ── */
#gtws-widget .gt-next{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
#gtws-widget .gt-card{
  position:relative; display:block; border-radius:14px; overflow:hidden;
  background:var(--gt-card2); border:1px solid var(--gt-line); min-height:230px;
}
#gtws-widget .gt-card .gt-ph{position:absolute; inset:0; background:linear-gradient(145deg,#1d2530,#0f1319);}
#gtws-widget .gt-card img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
#gtws-widget .gt-card .gt-scrim{position:absolute; inset:0;
  background:linear-gradient(180deg,rgba(8,10,13,.15) 0%,rgba(8,10,13,.55) 45%,rgba(8,10,13,.94) 100%);}
#gtws-widget .gt-card .gt-body{position:relative; height:100%; min-height:230px;
  display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:14px;}
#gtws-widget .gt-card .gt-top{position:absolute; top:12px; left:12px; right:12px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;}
#gtws-widget .gt-cname{display:block; color:#ffffff !important; font-size:16px; font-weight:800; line-height:1.25;}
#gtws-widget .gt-ctag{display:block; color:#d8dee5 !important; font-size:12.5px;}
#gtws-widget .gt-cstats{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}

/* ── 배지 / 칩 ── */
#gtws-widget .gt-pill{
  display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700;
  padding:4px 8px; border-radius:999px; white-space:nowrap;
  background:rgba(10,13,16,.78); color:#e9edf1 !important; border:1px solid rgba(255,255,255,.14);
}
#gtws-widget .gt-pill.gt-ws{background:var(--gt-gold); color:#101317 !important; border-color:transparent;}
#gtws-widget .gt-pill.gt-ns{background:var(--gt-blue); color:#0a1220 !important; border-color:transparent;}
#gtws-widget .gt-flag{width:20px; height:14px; object-fit:cover; border-radius:2px; flex:0 0 auto;
  background:#2a323b;}

/* ── 필터 ── */
#gtws-widget .gt-filter{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
#gtws-widget .gt-chip{
  color:var(--gt-muted) !important; background:var(--gt-card); border:1px solid var(--gt-line);
  font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:999px;
}
#gtws-widget .gt-chip[aria-pressed="true"]{color:#101317 !important; background:var(--gt-gold); border-color:transparent;}
#gtws-widget .gt-chip-alt{margin-left:auto;}
#gtws-widget .gt-chip-alt[aria-pressed="true"]{color:#f4f6f8 !important; background:#2f3947; border-color:#46525f;}

/* ── 대회 리스트 ── */
#gtws-widget .gt-list{display:flex; flex-direction:column; gap:7px;}
#gtws-widget .gt-row{
  display:grid; grid-template-columns:78px 24px 1fr auto; align-items:center; gap:12px;
  background:var(--gt-card); border:1px solid var(--gt-line); border-radius:12px;
  padding:11px 14px; transition:.15s;
}
#gtws-widget .gt-row:hover{background:var(--gt-card2); border-color:#39424d;}
#gtws-widget .gt-row.gt-done{opacity:.52;}
#gtws-widget .gt-date{color:var(--gt-gold) !important; font-size:13px; font-weight:800; font-variant-numeric:tabular-nums;}
#gtws-widget .gt-row.gt-done .gt-date{color:var(--gt-dim) !important;}
#gtws-widget .gt-rname{display:block; color:var(--gt-text) !important; font-size:14.5px; font-weight:700; line-height:1.3;}
#gtws-widget .gt-rmeta{display:block; color:var(--gt-muted) !important; font-size:12px; margin-top:2px;}
#gtws-widget .gt-rright{display:flex; align-items:center; gap:7px;}

/* ── 랭킹 ── */
#gtws-widget .gt-seg{display:inline-flex; gap:4px; background:var(--gt-card);
  border:1px solid var(--gt-line); border-radius:11px; padding:4px; margin-bottom:12px;}
#gtws-widget .gt-seg button{color:var(--gt-muted) !important; font-size:13.5px; font-weight:700;
  padding:7px 20px; border-radius:8px;}
#gtws-widget .gt-seg button[aria-selected="true"]{color:#101317 !important; background:var(--gt-gold);}
#gtws-widget .gt-tbl{width:100%; border-collapse:separate; border-spacing:0 6px;}
#gtws-widget .gt-tbl th{
  color:var(--gt-dim) !important; background:transparent; font-size:11.5px; font-weight:700;
  text-align:left; letter-spacing:.05em; padding:0 12px 2px;
}
#gtws-widget .gt-tbl th.gt-r, #gtws-widget .gt-tbl td.gt-r{text-align:right;}
#gtws-widget .gt-tbl th:first-child{width:58px; white-space:nowrap;}
#gtws-widget .gt-tbl td{
  background:var(--gt-card); color:var(--gt-text) !important; border-top:1px solid var(--gt-line);
  border-bottom:1px solid var(--gt-line); padding:11px 12px; font-size:14px; vertical-align:middle;
}
#gtws-widget .gt-tbl td:first-child{border-left:1px solid var(--gt-line); border-radius:11px 0 0 11px;}
#gtws-widget .gt-tbl td:last-child{border-right:1px solid var(--gt-line); border-radius:0 11px 11px 0;}
#gtws-widget .gt-tbl tr:hover td{background:var(--gt-card2);}
#gtws-widget .gt-pos{color:var(--gt-muted) !important; font-weight:800; font-variant-numeric:tabular-nums; width:48px;}
#gtws-widget .gt-tbl tr[data-top="1"] .gt-pos{color:var(--gt-gold) !important;}
#gtws-widget .gt-who{display:flex; align-items:center; gap:9px;}
#gtws-widget .gt-nm{color:var(--gt-text) !important; font-weight:700; font-size:14px;}
#gtws-widget .gt-club{color:var(--gt-muted) !important; font-size:12.5px;}
#gtws-widget .gt-pts{color:var(--gt-gold) !important; font-weight:800; font-variant-numeric:tabular-nums;}
#gtws-widget .gt-cnt{color:var(--gt-muted) !important; font-size:13px; font-variant-numeric:tabular-nums;}

/* ── 더보기 / 푸터 ── */
#gtws-widget .gt-more{
  display:block; width:100%; margin-top:10px; padding:12px;
  color:var(--gt-text) !important; background:var(--gt-card); border:1px solid var(--gt-line);
  border-radius:12px; font-size:13.5px; font-weight:700;
}
#gtws-widget .gt-more:hover{background:var(--gt-card2); border-color:#39424d;}
#gtws-widget .gt-foot{color:var(--gt-dim) !important; font-size:11.5px; margin-top:18px; text-align:center;}
#gtws-widget .gt-foot a{color:var(--gt-muted) !important; text-decoration:underline !important;}
#gtws-widget .gt-err{color:#ffb4b4 !important; background:#2a1618; border:1px solid #57282c;
  border-radius:12px; padding:16px; font-size:13.5px; line-height:1.6;}
#gtws-widget .gt-hide{display:none !important;}

/* ── 반응형 ── */
@media (min-width:1000px){
  #gtws-widget{padding:26px 26px 34px;}
  #gtws-widget .gt-next{gap:16px;}
  #gtws-widget .gt-card, #gtws-widget .gt-card .gt-body{min-height:280px;}
  #gtws-widget .gt-cname{font-size:17px;}
}
@media (max-width:900px){
  #gtws-widget .gt-next{grid-template-columns:1fr 1fr;}
  #gtws-widget .gt-next > :nth-child(3){grid-column:span 2;}
}
@media (max-width:620px){
  #gtws-widget{padding:16px 12px 24px; font-size:14px;}
  #gtws-widget .gt-next{grid-template-columns:1fr;}
  #gtws-widget .gt-next > :nth-child(3){grid-column:auto;}
  #gtws-widget .gt-stamp{margin-left:0;}
  #gtws-widget .gt-row{grid-template-columns:24px 1fr; gap:6px 10px; padding:12px;}
  #gtws-widget .gt-row .gt-date{grid-column:1 / -1; order:-1;}
  #gtws-widget .gt-rright{grid-column:1 / -1; flex-wrap:wrap;}
  #gtws-widget .gt-tbl th:nth-child(3), #gtws-widget .gt-tbl td:nth-child(3),
  #gtws-widget .gt-tbl th:nth-child(4), #gtws-widget .gt-tbl td:nth-child(4){display:none;}
  #gtws-widget .gt-tbl th{white-space:nowrap; padding:0 9px 2px;}
  #gtws-widget .gt-tbl th:first-child{width:40px;}
  #gtws-widget .gt-tbl td{padding:10px 9px;}
  #gtws-widget .gt-pos{width:34px;}
  #gtws-widget .gt-nm{font-size:13.5px;}
}
</style>

<script>
(function () {
  var ROOT = document.getElementById('gtws-widget');
  if (!ROOT || ROOT.dataset.gtInit) return;
  ROOT.dataset.gtInit = '1';

  var PAGE = 30;                    // 처음 보여줄 랭킹 인원
  var state = { tab: 'cal', sex: 'men', shown: PAGE, filter: 'all', hidePast: false, data: null };

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function flag(cc) {
    if (!cc) return '';
    return '<img class="gt-flag" loading="lazy" alt="' + esc(cc.toUpperCase()) + '"' +
           ' src="https://flagcdn.com/w40/' + esc(cc.toLowerCase()) + '.png"' +
           ' onerror="this.style.visibility=\'hidden\'">';
  }
  function seriesPill(s) {
    var ws = /World/i.test(s || '');
    return '<span class="gt-pill ' + (ws ? 'gt-ws' : 'gt-ns') + '">' + esc(ws ? 'WORLD' : 'NATIONAL') + '</span>';
  }
  function todayISO() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }
  function krDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[2] + '.' + m[3] : (iso || '');
  }
  function krFull(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : (iso || '');
  }
  function stat(v) { return v ? '<span class="gt-pill">' + esc(v) + '</span>' : ''; }

  /* ---------- 렌더 ---------- */
  function raceCard(r) {
    return '' +
      '<a class="gt-card" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<span class="gt-ph"></span>' +
        (r.image ? '<img loading="lazy" alt="" src="' + esc(r.image) + '" onerror="this.style.display=\'none\'">' : '') +
        '<span class="gt-scrim"></span>' +
        '<span class="gt-top">' +
          '<span class="gt-pill">' + esc(r.date) + '</span>' +
          flag(r.country) +
        '</span>' +
        '<span class="gt-body">' +
          '<span>' + seriesPill(r.series) + '</span>' +
          '<span class="gt-cname">' + esc(r.name) + '</span>' +
          (r.tagline ? '<span class="gt-ctag">' + esc(r.tagline) + '</span>' : '') +
          '<span class="gt-cstats">' + stat(r.distance) + stat(r.elevation) +
            (r.capacity ? '<span class="gt-pill">정원 ' + esc(r.capacity) + '</span>' : '') +
          '</span>' +
        '</span>' +
      '</a>';
  }

  function raceRow(r, today) {
    var done = r.dateISO && r.dateISO < today;
    return '' +
      '<a class="gt-row' + (done ? ' gt-done' : '') + '" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<span class="gt-date">' + esc(krDate(r.dateISO) || r.date) + (done ? ' 종료' : '') + '</span>' +
        '<span>' + flag(r.country) + '</span>' +
        '<span>' +
          '<span class="gt-rname">' + esc(r.name) + '</span>' +
          (r.tagline ? '<span class="gt-rmeta">' + esc(r.tagline) + '</span>' : '') +
        '</span>' +
        '<span class="gt-rright">' + stat(r.distance) + stat(r.elevation) + seriesPill(r.series) + '</span>' +
      '</a>';
  }

  function renderCalendar(d) {
    var today = todayISO();
    var list = (d.races || []).filter(function (r) {
      if (state.hidePast && r.dateISO && r.dateISO < today) return false;
      return state.filter === 'all' ||
        (state.filter === 'ws' && /World/i.test(r.series)) ||
        (state.filter === 'ns' && /National/i.test(r.series));
    });
    var chips = [['all', '전체'], ['ws', 'World Series'], ['ns', 'National Series']].map(function (c) {
      return '<button type="button" class="gt-chip" data-filter="' + c[0] + '" aria-pressed="' +
        (state.filter === c[0] ? 'true' : 'false') + '">' + c[1] + '</button>';
    }).join('') +
      '<button type="button" class="gt-chip gt-chip-alt" data-past="1" aria-pressed="' +
      (state.hidePast ? 'true' : 'false') + '">지난 대회 숨기기</button>';

    return '' +
      (d.nextUp && d.nextUp.length
        ? '<div class="gt-h"><i></i><span>NEXT UP</span><em>다음 대회</em></div>' +
          '<div class="gt-next">' + d.nextUp.map(raceCard).join('') + '</div>'
        : '') +
      '<div class="gt-h"><i></i><span>ALL RACES</span><em>' + list.length + '개 대회</em></div>' +
      '<div class="gt-filter">' + chips + '</div>' +
      '<div class="gt-list">' + (list.length ? list.map(function (r) { return raceRow(r, today); }).join('')
        : '<div class="gt-row"><span class="gt-rname">해당하는 대회가 없습니다.</span></div>') + '</div>';
  }

  function renderRanking(d) {
    var rows = (d.ranking && d.ranking[state.sex]) || [];
    var visible = rows.slice(0, state.shown);
    var body = visible.map(function (p) {
      return '' +
        '<tr data-top="' + (p.rank <= 3 ? '1' : '0') + '">' +
          '<td class="gt-pos">' + esc(p.rank || '-') + '</td>' +
          '<td><span class="gt-who">' + flag(p.country) + '<span class="gt-nm">' + esc(p.name) + '</span></span></td>' +
          '<td class="gt-club">' + esc(p.club || '—') + '</td>' +
          '<td class="gt-r gt-cnt">' + esc(p.raceCount || 0) + '</td>' +
          '<td class="gt-r gt-pts">' + esc(p.points) + '</td>' +
        '</tr>';
    }).join('');

    return '' +
      '<div class="gt-h"><i></i><span>OVERALL RANKING</span><em>' + esc(d.edition || '') + ' World Series 종합</em></div>' +
      '<div class="gt-seg">' +
        '<button type="button" data-sex="men"   aria-selected="' + (state.sex === 'men' ? 'true' : 'false') + '">남자</button>' +
        '<button type="button" data-sex="women" aria-selected="' + (state.sex === 'women' ? 'true' : 'false') + '">여자</button>' +
      '</div>' +
      (rows.length
        ? '<table class="gt-tbl"><thead><tr>' +
            '<th>순위</th><th>선수</th><th>팀</th><th class="gt-r">대회</th><th class="gt-r">포인트</th>' +
          '</tr></thead><tbody>' + body + '</tbody></table>' +
          (state.shown < rows.length
            ? '<button type="button" class="gt-more" data-more="1">더보기 (' + (rows.length - state.shown) + '명 남음)</button>'
            : '')
        : '<div class="gt-row"><span class="gt-rname">랭킹 데이터가 아직 없습니다.</span></div>');
  }

  function render() {
    var d = state.data;
    if (!d) return;
    ROOT.innerHTML = '' +
      '<div class="gt-head">' +
        '<div class="gt-title">GOLDEN TRAIL <b>SERIES</b></div>' +
        '<div class="gt-stamp">업데이트 ' + esc(krFull(d.updatedDate)) + '</div>' +
      '</div>' +
      '<div class="gt-tabs" role="tablist">' +
        '<button type="button" class="gt-tab" role="tab" data-tab="cal"  aria-selected="' + (state.tab === 'cal' ? 'true' : 'false') + '">대회 일정</button>' +
        '<button type="button" class="gt-tab" role="tab" data-tab="rank" aria-selected="' + (state.tab === 'rank' ? 'true' : 'false') + '">세계 랭킹</button>' +
      '</div>' +
      '<div class="gt-panel">' + (state.tab === 'cal' ? renderCalendar(d) : renderRanking(d)) + '</div>' +
      '<div class="gt-foot">자료 출처 · <a href="https://goldentrailseries.com/" target="_blank" rel="noopener">goldentrailseries.com</a>' +
        ' · 매일 오전 8시 자동 갱신</div>';
  }

  /* ---------- 이벤트 (위임) ---------- */
  ROOT.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-sex],[data-filter],[data-more],[data-past]');
    if (!t || !ROOT.contains(t)) return;
    e.preventDefault();
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.shown = PAGE; }
    else if (t.dataset.sex) { state.sex = t.dataset.sex; state.shown = PAGE; }
    else if (t.dataset.filter) { state.filter = t.dataset.filter; }
    else if (t.dataset.past) { state.hidePast = !state.hidePast; }
    else if (t.dataset.more) { state.shown += PAGE; }
    render();
  });

  /* ---------- 로드 ---------- */
  function fail(msg, url) {
    ROOT.innerHTML = '<div class="gt-err"><b>데이터를 불러오지 못했습니다.</b><br>' + esc(msg) +
      '<br><br>확인할 주소: <code>' + esc(url) + '</code></div>';
  }

  if (window.GTWS_PREVIEW_DATA) {          // 로컬 미리보기용
    state.data = window.GTWS_PREVIEW_DATA;
    render();
    return;
  }

  var url = ROOT.getAttribute('data-src') || '';
  var bust = url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + Math.floor(Date.now() / 36e5);

  fetch(bust, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (json) { state.data = json; render(); })
    .catch(function (err) { fail(err.message, url); });
})();
</script>
