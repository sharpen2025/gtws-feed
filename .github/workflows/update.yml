name: Update GTWS data

on:
  schedule:
    # 23:00 UTC = 08:00 (한국시간) 매일
    - cron: '0 23 * * *'
  workflow_dispatch: # 버튼으로 직접 실행

permissions:
  contents: write

concurrency:
  group: gtws-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 데이터 수집
        run: node scrape.mjs

      - name: 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gtws.json
          git diff --cached --quiet && git commit --allow-empty -m "chore: 데이터 갱신 (변동 없음)" \
            || git commit -m "chore: 데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
