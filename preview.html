<style>

#gtws-widget .gt-hide{display:none !important;}

/* ── 반응형 ── */
@media (min-width:1000px){
  #gtws-widget{padding:26px 26px 34px;}
  #gtws-widget .gt-next{gap:16px;}
  #gtws-widget .gt-card, #gtws-widget .gt-card .gt-body{min-height:280px;}
  #gtws-widget .gt-cname{font-size:17px;}
}
@media (max-width:900px){
  #gtws-widget .gt-next{grid-template-columns:1fr 1fr;}
  #gtws-widget .gt-next > :nth-child(3){grid-column:span 2;}
}
@media (max-width:620px){
  #gtws-widget{padding:16px 12px 24px; font-size:14px;}
  #gtws-widget .gt-next{grid-template-columns:1fr;}
  #gtws-widget .gt-next > :nth-child(3){grid-column:auto;}
  #gtws-widget .gt-stamp{margin-left:0;}
  #gtws-widget .gt-row{grid-template-columns:24px 1fr; gap:6px 10px; padding:12px;}
  #gtws-widget .gt-row .gt-date{grid-column:1 / -1; order:-1;}
  #gtws-widget .gt-rright{grid-column:1 / -1; flex-wrap:wrap;}
  #gtws-widget .gt-tbl th:nth-child(3), #gtws-widget .gt-tbl td:nth-child(3),
  #gtws-widget .gt-tbl th:nth-child(4), #gtws-widget .gt-tbl td:nth-child(4){display:none;}
  #gtws-widget .gt-tbl th{white-space:nowrap; padding:0 9px 2px;}
  #gtws-widget .gt-tbl th:first-child{width:40px;}
  #gtws-widget .gt-tbl td{padding:10px 9px;}
  #gtws-widget .gt-pos{width:34px;}
  #gtws-widget .gt-nm{font-size:13.5px;}
}
</style>

<script>
(function () {
  var ROOT = document.getElementById('gtws-widget');
  if (!ROOT || ROOT.dataset.gtInit) return;
  ROOT.dataset.gtInit = '1';

  var PAGE = 30;                    // 처음 보여줄 랭킹 인원
  var state = { tab: 'cal', sex: 'men', shown: PAGE, filter: 'all', hidePast: false, data: null };

  /* ---------- 유틸 ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function flag(cc) {
    if (!cc) return '';
    return '<img class="gt-flag" loading="lazy" alt="' + esc(cc.toUpperCase()) + '"' +
           ' src="https://flagcdn.com/w40/' + esc(cc.toLowerCase()) + '.png"' +
           ' onerror="this.style.visibility=\'hidden\'">';
  }
  function seriesPill(s) {
    var ws = /World/i.test(s || '');
    return '<span class="gt-pill ' + (ws ? 'gt-ws' : 'gt-ns') + '">' + esc(ws ? 'WORLD' : 'NATIONAL') + '</span>';
  }
  function todayISO() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) {
      return new Date().toISOString().slice(0, 10);
    }
  }
  function krDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[2] + '.' + m[3] : (iso || '');
  }
  function krFull(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : (iso || '');
  }
  function stat(v) { return v ? '<span class="gt-pill">' + esc(v) + '</span>' : ''; }

  /* ---------- 렌더 ---------- */
  function raceCard(r) {
    return '' +
      '<a class="gt-card" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<span class="gt-ph"></span>' +
        (r.image ? '<img loading="lazy" alt="" src="' + esc(r.image) + '" onerror="this.style.display=\'none\'">' : '') +
        '<span class="gt-scrim"></span>' +
        '<span class="gt-top">' +
          '<span class="gt-pill">' + esc(r.date) + '</span>' +
          flag(r.country) +
        '</span>' +
        '<span class="gt-body">' +
          '<span>' + seriesPill(r.series) + '</span>' +
          '<span class="gt-cname">' + esc(r.name) + '</span>' +
          (r.tagline ? '<span class="gt-ctag">' + esc(r.tagline) + '</span>' : '') +
          '<span class="gt-cstats">' + stat(r.distance) + stat(r.elevation) +
            (r.capacity ? '<span class="gt-pill">정원 ' + esc(r.capacity) + '</span>' : '') +
          '</span>' +
        '</span>' +
      '</a>';
  }

  function raceRow(r, today) {
    var done = r.dateISO && r.dateISO < today;
    return '' +
      '<a class="gt-row' + (done ? ' gt-done' : '') + '" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<span class="gt-date">' + esc(krDate(r.dateISO) || r.date) + (done ? ' 종료' : '') + '</span>' +
        '<span>' + flag(r.country) + '</span>' +
        '<span>' +
          '<span class="gt-rname">' + esc(r.name) + '</span>' +
          (r.tagline ? '<span class="gt-rmeta">' + esc(r.tagline) + '</span>' : '') +
        '</span>' +
        '<span class="gt-rright">' + stat(r.distance) + stat(r.elevation) + seriesPill(r.series) + '</span>' +
      '</a>';
  }

  function renderCalendar(d) {
    var today = todayISO();
    var list = (d.races || []).filter(function (r) {
      if (state.hidePast && r.dateISO && r.dateISO < today) return false;
      return state.filter === 'all' ||
        (state.filter === 'ws' && /World/i.test(r.series)) ||
        (state.filter === 'ns' && /National/i.test(r.series));
    });
    var chips = [['all', '전체'], ['ws', 'World Series'], ['ns', 'National Series']].map(function (c) {
      return '<button type="button" class="gt-chip" data-filter="' + c[0] + '" aria-pressed="' +
        (state.filter === c[0] ? 'true' : 'false') + '">' + c[1] + '</button>';
    }).join('') +
      '<button type="button" class="gt-chip gt-chip-alt" data-past="1" aria-pressed="' +
      (state.hidePast ? 'true' : 'false') + '">지난 대회 숨기기</button>';

    return '' +
      (d.nextUp && d.nextUp.length
        ? '<div class="gt-h"><i></i><span>NEXT UP</span><em>다음 대회</em></div>' +
          '<div class="gt-next">' + d.nextUp.map(raceCard).join('') + '</div>'
        : '') +
      '<div class="gt-h"><i></i><span>ALL RACES</span><em>' + list.length + '개 대회</em></div>' +
      '<div class="gt-filter">' + chips + '</div>' +
      '<div class="gt-list">' + (list.length ? list.map(function (r) { return raceRow(r, today); }).join('')
        : '<div class="gt-row"><span class="gt-rname">해당하는 대회가 없습니다.</span></div>') + '</div>';
  }

  function renderRanking(d) {
    var rows = (d.ranking && d.ranking[state.sex]) || [];
    var visible = rows.slice(0, state.shown);
    var body = visible.map(function (p) {
      return '' +
        '<tr data-top="' + (p.rank <= 3 ? '1' : '0') + '">' +
          '<td class="gt-pos">' + esc(p.rank || '-') + '</td>' +
          '<td><span class="gt-who">' + flag(p.country) + '<span class="gt-nm">' + esc(p.name) + '</span></span></td>' +
          '<td class="gt-club">' + esc(p.club || '—') + '</td>' +
          '<td class="gt-r gt-cnt">' + esc(p.raceCount || 0) + '</td>' +
          '<td class="gt-r gt-pts">' + esc(p.points) + '</td>' +
        '</tr>';
    }).join('');

    return '' +
      '<div class="gt-h"><i></i><span>OVERALL RANKING</span><em>' + esc(d.edition || '') + ' World Series 종합</em></div>' +
      '<div class="gt-seg">' +
        '<button type="button" data-sex="men"   aria-selected="' + (state.sex === 'men' ? 'true' : 'false') + '">남자</button>' +
        '<button type="button" data-sex="women" aria-selected="' + (state.sex === 'women' ? 'true' : 'false') + '">여자</button>' +
      '</div>' +
      (rows.length
        ? '<table class="gt-tbl"><thead><tr>' +
            '<th>순위</th><th>선수</th><th>팀</th><th class="gt-r">대회</th><th class="gt-r">포인트</th>' +
          '</tr></thead><tbody>' + body + '</tbody></table>' +
          (state.shown < rows.length
            ? '<button type="button" class="gt-more" data-more="1">더보기 (' + (rows.length - state.shown) + '명 남음)</button>'
            : '')
        : '<div class="gt-row"><span class="gt-rname">랭킹 데이터가 아직 없습니다.</span></div>');
  }

  function render() {
    var d = state.data;
    if (!d) return;
    ROOT.innerHTML = '' +
      '<div class="gt-head">' +
        '<div class="gt-title">GOLDEN TRAIL <b>SERIES</b></div>' +
        '<div class="gt-stamp">업데이트 ' + esc(krFull(d.updatedDate)) + '</div>' +
      '</div>' +
      '<div class="gt-tabs" role="tablist">' +
        '<button type="button" class="gt-tab" role="tab" data-tab="cal"  aria-selected="' + (state.tab === 'cal' ? 'true' : 'false') + '">대회 일정</button>' +
        '<button type="button" class="gt-tab" role="tab" data-tab="rank" aria-selected="' + (state.tab === 'rank' ? 'true' : 'false') + '">세계 랭킹</button>' +
      '</div>' +
      '<div class="gt-panel">' + (state.tab === 'cal' ? renderCalendar(d) : renderRanking(d)) + '</div>' +
      '<div class="gt-foot">자료 출처 · <a href="https://goldentrailseries.com/" target="_blank" rel="noopener">goldentrailseries.com</a>' +
        ' · 매일 오전 8시 자동 갱신</div>';
  }

  /* ---------- 이벤트 (위임) ---------- */
  ROOT.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-sex],[data-filter],[data-more],[data-past]');
    if (!t || !ROOT.contains(t)) return;
    e.preventDefault();
    if (t.dataset.tab) { state.tab = t.dataset.tab; state.shown = PAGE; }
    else if (t.dataset.sex) { state.sex = t.dataset.sex; state.shown = PAGE; }
    else if (t.dataset.filter) { state.filter = t.dataset.filter; }
    else if (t.dataset.past) { state.hidePast = !state.hidePast; }
    else if (t.dataset.more) { state.shown += PAGE; }
    render();
  });

  /* ---------- 로드 ---------- */
  function fail(msg, url) {
    ROOT.innerHTML = '<div class="gt-err"><b>데이터를 불러오지 못했습니다.</b><br>' + esc(msg) +
      '<br><br>확인할 주소: <code>' + esc(url) + '</code></div>';
  }

  if (window.GTWS_PREVIEW_DATA) {          // 로컬 미리보기용
    state.data = window.GTWS_PREVIEW_DATA;
    render();
    return;
  }

  var url = ROOT.getAttribute('data-src') || '';
  var bust = url + (url.indexOf('?') > -1 ? '&' : '?') + 'v=' + Math.floor(Date.now() / 36e5);

  fetch(bust, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (json) { state.data = json; render(); })
    .catch(function (err) { fail(err.message, url); });
})();
</script>

</div>
</body>
</html>
